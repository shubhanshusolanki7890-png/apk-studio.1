name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Frontend & Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Project Archive
        shell: bash
        run: |
          set -e
          if [ -z "$(find . -maxdepth 4 -path '*/app-shell/gradlew' -print -quit)" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" -print -quit)
            if [ -n "$ZIP_FILE" ]; then
              echo "Extracting archive: $ZIP_FILE"
              unzip -q -o "$ZIP_FILE" -d .
            fi
          fi

          APP_SHELL_DIR=$(find . -maxdepth 5 -type d -name "app-shell" -print -quit)
          if [ -z "$APP_SHELL_DIR" ]; then
            echo "ERROR: Could not locate app-shell directory in repository."
            ls -la
            exit 1
          fi
          PROJECT_ROOT=$(cd "$(dirname "$APP_SHELL_DIR")" && pwd)
          echo "Resolved absolute PROJECT_ROOT=$PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web IDE Frontend Bundle
        run: |
          node "$PROJECT_ROOT/web-ide/scripts/build-web-ide.cjs"
          test -f "$PROJECT_ROOT/app-shell/app/src/main/assets/webapp/index.html"
          ls -la "$PROJECT_ROOT/app-shell/app/src/main/assets/webapp/"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses || true
          fi

      - name: Compile Android Debug APK
        run: |
          cd "$PROJECT_ROOT/app-shell"
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify and Stage APK Artifact
        run: |
          APK_FILE=$(find "$PROJECT_ROOT/app-shell" -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK found after build."
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          ls -lh "$APK_FILE"
          sha256sum "$APK_FILE"
          mkdir -p "$GITHUB_WORKSPACE/output-apk"
          cp "$APK_FILE" "$GITHUB_WORKSPACE/output-apk/app-debug.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: output-apk/app-debug.apk
          if-no-files-found: error

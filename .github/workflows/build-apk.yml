
name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK Studio Android Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Archive
        shell: bash
        run: |
          set -euo pipefail

          if ! find . -maxdepth 6 -path '*/app-shell/gradlew' -print -quit | grep -q .; then
            ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" -print -quit)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Android project or ZIP archive found."
              exit 1
            fi

            echo "Extracting: $ZIP_FILE"

            mkdir -p /tmp/apk-studio-extract
            unzip -q -o "$ZIP_FILE" -d /tmp/apk-studio-extract

            INNER_APP=$(find /tmp/apk-studio-extract -maxdepth 6 -path '*/app-shell/gradlew' -print -quit)

            if [ -z "$INNER_APP" ]; then
              echo "ERROR: app-shell/gradlew not found inside archive."
              exit 1
            fi

            INNER_ROOT=$(dirname "$(dirname "$INNER_APP")")
            cp -a "$INNER_ROOT/." "$GITHUB_WORKSPACE/"
          fi

          APP_SHELL=$(find . -maxdepth 6 -path '*/app-shell/gradlew' -print -quit)

          if [ -z "$APP_SHELL" ]; then
            echo "ERROR: Could not locate Android Gradle project."
            exit 1
          fi

          PROJECT_ROOT=$(cd "$(dirname "$(dirname "$APP_SHELL")")" && pwd)

          if [ ! -d "$PROJECT_ROOT/web-ide" ]; then
            echo "ERROR: web-ide directory missing."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Project located at: $PROJECT_ROOT"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Web IDE Dependencies
        working-directory: ${{ env.PROJECT_ROOT }}/web-ide
        run: npm ci --no-audit --no-fund

      - name: Build Web IDE Frontend
        working-directory: ${{ env.PROJECT_ROOT }}/web-ide
        run: node scripts/build-web-ide.cjs

      - name: Verify Frontend Assets
        run: |
          set -e

          WEBAPP="$PROJECT_ROOT/app-shell/app/src/main/assets/webapp"

          if [ ! -f "$WEBAPP/index.html" ]; then
            echo "ERROR: Frontend index.html missing."
            exit 1
          fi

          if [ ! -d "$WEBAPP/assets" ]; then
            echo "ERROR: Frontend assets directory missing."
            exit 1
          fi

          echo "Frontend build verified."
          find "$WEBAPP" -maxdepth 2 -type f

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Verify Gradle Wrapper
        run: |
          cd "$PROJECT_ROOT/app-shell"

          chmod +x gradlew

          ./gradlew --version

      - name: Compile Android Debug APK
        run: |
          cd "$PROJECT_ROOT/app-shell"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        run: |
          set -e

          APK_FILE="$PROJECT_ROOT/app-shell/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: APK compilation failed."
            find "$PROJECT_ROOT/app-shell" -name "*.apk" -type f
            exit 1
          fi

          echo "APK successfully generated."

          ls -lh "$APK_FILE"
          sha256sum "$APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/output-apk"

          cp "$APK_FILE" "$GITHUB_WORKSPACE/output-apk/app-debug.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-studio-debug-apk
          path: output-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          

name: Build APK Studio Android APK

# Put this file at: .github/workflows/build-apk.yml
# Builds the Web IDE into the WebView assets, then compiles a debug APK
# (Gradle 8.5 / AGP 8.2.2 / JDK 17 / Android SDK 34).

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Works whether the project files are in the repo or you uploaded
      # apk-studio.zip. A ZIP is extracted inside the runner only; nothing is
      # committed or pushed back.
      - name: Locate project root (extract uploaded ZIP if needed)
        shell: bash
        run: |
          set -euo pipefail

          APP_SHELL_DIR="$(find . -maxdepth 4 -type d -name app-shell -not -path '*/node_modules/*' -print -quit)"

          if [ -z "$APP_SHELL_DIR" ]; then
            ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -not -path './.git/*' -print -quit)"
            if [ -z "$ZIP_FILE" ]; then
              echo "::error::No app-shell/ directory and no .zip file found in the repository."
              ls -la
              exit 1
            fi
            echo "Extracting $ZIP_FILE"
            mkdir -p _extracted
            unzip -q -o "$ZIP_FILE" -d _extracted
            APP_SHELL_DIR="$(find _extracted -maxdepth 4 -type d -name app-shell -print -quit)"
            if [ -z "$APP_SHELL_DIR" ]; then
              echo "::error::The ZIP does not contain an app-shell/ directory."
              exit 1
            fi
          fi

          PROJECT_ROOT="$(cd "$(dirname "$APP_SHELL_DIR")" && pwd)"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_ROOT"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --prefix keeps npm from treating the repo root as a workspace, so only
      # the Web IDE dependencies are installed (not the backend's native deps).
      # The build script uses Vite when available and falls back to its
      # built-in compiler, so the assets are always produced.
      - name: Build Web IDE into app-shell assets
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT/web-ide"
          npm install --prefix . --no-audit --no-fund
          npm run build --prefix .

      - name: Verify bundled WebView assets
        shell: bash
        run: |
          set -euo pipefail
          WEBAPP="$PROJECT_ROOT/app-shell/app/src/main/assets/webapp"
          test -s "$WEBAPP/index.html"
          ls -la "$WEBAPP" "$WEBAPP/assets"
          ls "$WEBAPP"/assets/*.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already includes the Android SDK, so no setup action is
      # needed. This just accepts licenses and makes sure the exact pieces exist.
      - name: Install SDK platform 34 and build-tools 34.0.0
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      # The project's gradle-wrapper.jar is a non-official stub that Gradle's
      # wrapper validation rejects. We don't use ./gradlew (a real Gradle 8.5
      # is installed below), so remove the stub from this runner's copy only.
      - name: Remove stub Gradle wrapper jar
        shell: bash
        run: find "$PROJECT_ROOT/app-shell" -name 'gradle-wrapper.jar' -delete

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          validate-wrappers: false

      # The launcher icons reference @color/theme_color, but the project has no
      # colors.xml, so resource linking fails. Create it only if it is missing.
      - name: Add missing theme_color resource
        shell: bash
        run: |
          set -euo pipefail
          VALUES="$PROJECT_ROOT/app-shell/app/src/main/res/values"
          mkdir -p "$VALUES"
          if ! grep -rqs 'name="theme_color"' "$VALUES"; then
            cat > "$VALUES/colors.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="theme_color">#4F46E5</color>
          </resources>
          EOF
            echo "Created $VALUES/colors.xml"
          fi

      - name: Compile debug APK
        shell: bash
        run: |
          cd "$PROJECT_ROOT/app-shell"
          gradle assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_ROOT/app-shell/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          echo "sha256: $SHA"

          # Confirm the Web IDE is really packaged inside the APK.
          unzip -l "$APK" > "$RUNNER_TEMP/apk-listing.txt"
          grep -q 'AndroidManifest.xml' "$RUNNER_TEMP/apk-listing.txt"
          grep -q 'assets/webapp/index.html' "$RUNNER_TEMP/apk-listing.txt"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/app-debug.apk"

          {
            echo "### APK built"
            echo "- Size: $(du -h "$APK" | cut -f1)"
            echo "- SHA-256: \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-studio-debug-apk
          path: apk-output/app-debug.apk
          if-no-files-found: error
          retention-days: 30
